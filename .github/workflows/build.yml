name: Build Android App

on:
  push:
    branches: [ "main", "master", "feat/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"

      - name: Report unit test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          log = os.path.join(os.environ.get("RUNNER_TEMP", ""), "gradle-test.log")
          if os.path.exists(log):
              lines = [line.rstrip() for line in open(log, errors="replace") if line.strip()]
              compile_errors = [l for l in lines if l.startswith("e: ") or " error: " in l]
              failed_tasks = [l for l in lines if l.startswith("> Task") and "FAILED" in l]
              for line in (compile_errors or failed_tasks or lines[-6:])[:10]:
                  print("::error::" + line[:900])

          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  node = case.find("failure")
                  if node is None:
                      node = case.find("error")
                  if node is None:
                      continue
                  message = (node.get("message") or node.text or "").strip().replace("\n", " ")
                  print("::error title=%s.%s::%s" % (case.get("classname"), case.get("name"), message[:900]))
          PY

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
